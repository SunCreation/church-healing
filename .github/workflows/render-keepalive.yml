name: Render Keep Alive

on:
  schedule:
    # Requested interval only: GitHub may delay or drop scheduled runs.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    # Skip scheduled runs until the real deployment URL is configured.
    # Manual runs still report a clear configuration error.
    if: ${{ vars.RENDER_HEALTH_URL != '' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # Browser and Linux dependencies are preinstalled; avoid downloading them each run.
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --ipc=host
    env:
      RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Request Render health endpoint
        shell: bash
        run: bash scripts/check-render-health.sh
      - name: Install browser test dependency
        run: python3 -m pip install --disable-pip-version-check -r scripts/monitor-requirements.txt
      - name: Enter and interact with the live app
        timeout-minutes: 2
        run: python3 scripts/monitor-render.py
      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: render-browser-failure
          path: artifacts/render-browser/
          retention-days: 1
          if-no-files-found: ignore
